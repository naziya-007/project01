name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # The tests need a NON-superuser that owns the database: superusers bypass
      # row-level security, which would make the RLS tests meaningless.
      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE trustvault LOGIN PASSWORD 'trustvault' NOSUPERUSER"
          psql -h localhost -U postgres -c "CREATE DATABASE trustvault_test OWNER trustvault"
      - name: Unit and integration tests
        env:
          TEST_DATABASE_URL: postgresql://trustvault:trustvault@localhost:5432/trustvault_test
        run: python -m unittest discover -s tests -t . -v
      - name: Mutation check (remove each authorization check; tests must fail)
        env:
          TEST_DATABASE_URL: postgresql://trustvault:trustvault@localhost:5432/trustvault_test
        run: python scripts/mutation_check.py
