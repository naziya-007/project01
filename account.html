{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Your account</h1>
  <p>{{ current_user.full_name }} · {{ current_user.email }} · role <strong>{{ current_user.role }}</strong></p>
  <h2>Change password</h2>
  <form method="post" action="{{ url_for('ui.account') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current password <input type="password" name="current_password" required autocomplete="current-password"></label>
    <label>New password (12+ characters) <input type="password" name="new_password" required minlength="12" autocomplete="new-password"></label>
    <button>Change password</button>
  </form>
  <p class="muted">Changing your password signs out every other session immediately.</p>
</section>
{% endblock %}
